; PHP-FPM runs as deploy, the user the arms ssh in as, master and workers both:
; a release unpacked over ssh is readable, var/ is writable by the same user,
; and the arms can reload it (zdtfleet-fpm-reload) after they edit env.php.
[global]
pid = /run/php-fpm/php-fpm.pid
; The base image logs to /proc/self/fd/2, Docker's stderr pipe, which only root
; may open; as deploy, PHP-FPM writes its log on the node instead.
error_log = /var/log/php-fpm/error.log
; A reload waits this long for requests in flight before replacing a worker.
process_control_timeout = 10s

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
ping.path = /fpm-ping
; nginx already logs every request.
access.log = /dev/null
