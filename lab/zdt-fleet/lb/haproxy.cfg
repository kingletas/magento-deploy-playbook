# Round robin over the three nodes, taking a node out after three failed
# health checks two seconds apart and back after two good ones. Server state
# changes are logged, and the stats page on port 8404 counts them per node,
# which is what the arms judge falsifier 5 by.
global
    log stdout format raw local0 info
    # The runtime API, for lab/zdt-fleet/bin/lb-state to take a node out and
    # put it back. Admin level with no password, so it listens on the fleet
    # network only: compose publishes port 80 alone.
    stats socket ipv4@:9999 level admin

# Docker's DNS, asked again while running: a recreated web node comes back on
# a new address, and a name resolved only at start would then point at
# whichever container took the old one.
resolvers docker
    parse-resolv-conf
    hold valid 10s

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 600s

# Reached on the fleet network only: compose publishes port 80 alone.
frontend stats
    bind :8404
    stats enable
    stats uri /stats

frontend fleet
    bind :80
    default_backend web

backend web
    balance roundrobin
    option httpchk GET /health_check.php
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 resolvers docker init-addr libc,none
    server web1 web1:80 check
    server web2 web2:80 check
    server web3 web3:80 check
