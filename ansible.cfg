[defaults]
# Ansible resolves ansible.cfg from the process WORKING DIRECTORY, never from
# the playbook's location, so every entry point runs from this directory. Run
# the playbook from elsewhere and this file is silently ignored.

# Uncomment after `ansible-vault encrypt group_vars/all/notifications.yml`.
# vault_password_file = .vault-pass

host_key_checking = False
forks = 30
remote_tmp = /tmp/ansible-$USER

# The key is `remote_user`. `ansible_user` is NOT a valid ansible.cfg key, so
# setting it here is inert while the file looks configured.
remote_user = ubuntu

# The cutover runs setup:upgrade when its status checks error out, so a
# transient SSH blip could turn into a full upgrade run.
timeout = 30

retry_files_enabled = False

# The inventories pin ansible_python_interpreter; stay quiet for any that do not.
interpreter_python = auto_silent

# Turn on before attempting an ansible-core upgrade -- that is when the
# warnings are the point.
deprecation_warnings = True

# NO filter_plugins or library setting, deliberately. Pointing either above this
# directory stops the playbook being self-contained, and a clone without the
# parent tree then loses a filter and every template using it raises.
# bin/check-structure fails on any parent path. Vendor plugins HERE instead.
