; Production settings for a node that switches releases by relinking current.
; OPcache keys scripts by their real path and never rechecks a file, and the
; realpath cache expires in two seconds, so a relink is seen without a reload.
memory_limit = 2G
max_execution_time = 600
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 60000
opcache.validate_timestamps = 0
opcache.revalidate_path = 0
realpath_cache_ttl = 2
realpath_cache_size = 4096K
