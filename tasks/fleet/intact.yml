---
###
# Stops the whole deploy when a web host it began with has dropped out, so a
# fleet split between two releases is recorded as a failure, never a success.
#
#   fleet_phase   where in the deploy this is checked: upload, before-cutover,
#                 before-switch, switch or after-switch.
###
- name: "Fleet: every web host that began the deploy is still in it, at {{ fleet_phase }}"
  any_errors_fatal: true
  block:
    - name: Name the web hosts that dropped out
      ansible.builtin.set_fact:
        fleet_lost: "{{ hostvars['localhost'].fleet_expected | default([]) | difference(ansible_play_hosts) }}"
      run_once: true

    - name: "Audit: record the failed deploy"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: deploy.failed
        audit_detail:
          phase: "{{ fleet_phase }}"
          lost_hosts: "{{ fleet_lost }}"
      when: fleet_lost | length > 0

    # After the switch the fleet may be split between two releases, which a
    # person should see before anyone deploys again, so the lock stays held and
    # says why. Before it, nothing is live and the play's response releases it.
    - name: Keep the build lock, and write why
      ansible.builtin.include_tasks: tasks/release-lock/hold.yml
      vars:
        lock_hold_reason: >-
          it lost {{ fleet_lost | join(', ') }} at {{ fleet_phase }} and the web hosts
          may serve different releases
      when:
        - fleet_lost | length > 0
        - fleet_phase in ['switch', 'after-switch']

    - name: Stop the deploy, naming the hosts it lost
      ansible.builtin.fail:
        msg: >-
          {% if fleet_phase in ['switch', 'after-switch'] %}The deploy lost
          {{ fleet_lost | join(', ') }} at {{ fleet_phase }}, so the web hosts may now
          serve different releases. The deploy is recorded as failed, and the build
          lock stays held with that reason. Bring the host back, then run
          make unlock environment=<env> and deploy again.{% else %}The deploy lost
          {{ fleet_lost | join(', ') }} at {{ fleet_phase }} and is recorded as
          failed. Bring the host back and deploy again.{% endif %}
      when: fleet_lost | length > 0
