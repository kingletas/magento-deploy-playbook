---
###
# How the release is built and finished off.
###

# Asserted by tasks/packaging/bundle.yml before anything runs.
php_minimum_version: '8.0'

###
# JavaScript bundling: `manipulus`, `magepack` or `none`. Both bundlers read the
# DEPLOYED static content, so this runs after setup:static-content:deploy.
#
# What each one needs from your store is in README.md, under Bundling.
###
bundler: manipulus

bundler_theme: frontend/Magento/luma
bundler_locale: en_US

# Override when manipulus is not on PATH, e.g. a `docker run` invocation.
manipulus_command: manipulus
manipulus_module_path: app/code/Manipulus/Bundles

magepack_image: magepack:local
magepack_command: "docker run --rm -w /app -v {{ wdir }}:/app {{ magepack_image }}"

###
# The commands each bundler runs. An empty list is a real answer, which is what
# distinguishes `none` from a bundler nobody configured.
#
# These embed {{ wdir }}, so the table cannot be TOUCHED before
# release-preflight has run -- even `bundler_steps is defined` raises, because
# evaluating it templates the values.
###
bundler_steps:
  # Without integrity:refresh the recorded hash stops matching the rewritten
  # requirejs-config, and checkout spins for ever with nothing in the console.
  manipulus:
    - >-
      {{ manipulus_command }} build
      --root {{ wdir }}
      --theme {{ bundler_theme }}
      --locale {{ bundler_locale }}
      --module {{ manipulus_module_path }}
    - "php bin/magento manipulus:integrity:refresh"
  magepack:
    - "{{ magepack_command }} bundle -m"
  none: []

###
# Reusing the previous build's compiled code and static content when nothing
# either phase reads has changed. tasks/packaging/build-skip.yml says how the
# fingerprints are taken and what they cannot see.
#
#   compile, static   false makes that phase run every time
#   max_age_days      a phase's output this old is rebuilt whatever its
#                     fingerprint says
###
build_skip:
  compile: true
  static: true
  max_age_days: 7

# Command strings as they run, so changing a flag changes the fingerprint.
compile_command: "php bin/magento s:d:c"
static_command: "php bin/magento s:static-content:d -j 5 -f"

# Files every deployed theme and locale must have after static content deploy,
# under pub/static/<area>/<vendor>/<theme>/<locale>/, each written by this
# deploy. Each area lists alternatives, and a theme passes on any one of them:
# Luma and Blank themes compile the two stylesheets, a Hyva theme compiles
# css/styles.css.
static_sentinels:
  frontend:
    - [css/styles-m.css, css/styles-l.css]
    - [css/styles.css]
  adminhtml:
    - [css/styles.css]

# git pathspecs for what each phase reads. Compile reads everything except what
# only the storefront's assets are made from; static reads those assets plus
# what orders and registers them: config.php and module.xml fix the module
# order the merged requirejs-config follows, and a di.xml can register an asset
# preprocessor. composer.json, composer.lock and patches/ stand for vendor/.
build_skip_compile_paths:
  - "."
  - ":(glob,exclude)**/view/**"
  - ":(glob,exclude)**/i18n/**"
  - ":(glob,exclude)**/web/**"
  - ":(glob,exclude)lib/web/**"
  - ":(glob,exclude)pub/**"
  - ":(glob,exclude)**/*.md"
  - ":(glob,exclude)**/*.phtml"
  - ":(glob,exclude)**/*.less"
  - ":(glob,exclude)**/*.css"
  - ":(glob,exclude)**/*.js"
  - ":(glob,exclude)**/*.html"
  - ":(glob,exclude)**/*.csv"
build_skip_static_paths:
  - composer.json
  - composer.lock
  - ":(glob)patches/**"
  - app/etc/config.php
  - ":(glob)**/etc/module.xml"
  - ":(glob)**/etc/di.xml"
  - ":(glob)**/registration.php"
  - ":(glob)**/theme.xml"
  - ":(glob)**/view/**"
  - ":(glob)**/i18n/**"
  - ":(glob)**/web/**"
  - ":(glob)app/design/**"
  - ":(glob)lib/web/**"
  - ":(glob)**/*.less"
  - ":(glob)**/*.css"
  - ":(glob)**/*.js"
  - ":(glob)**/*.html"
  - ":(glob)**/*.phtml"
  - ":(glob)**/*.csv"
  - magepack.config.js

# Settings each phase's output depends on that are not files in the store.
build_skip_compile_extra:
  - "{{ compile_command }}"
  - "php {{ php_version }}"
build_skip_static_extra:
  - "{{ static_command }}"
  - "php {{ php_version }}"
  - "bundler {{ bundler }}"
  # Without the release's own path, which the bundler commands carry and which
  # differs on every build.
  - "{{ bundler_steps[bundler] | to_json | replace(wdir, '<release>') }}"

# Run on the build host after the bundler: a theme's grunt task, a sourcemap
# upload, anything this playbook does not know about.
extra_build_steps: []

# Timestamp for the New Relic and Noibu payloads. Not ansible_date_time: a body
# is templated when the task's arguments are BUILT, so a fact the host never
# gathered raises where `failed_when: false` cannot suppress it.
notification_timestamp: >-
  {{ ansible_date_time.iso8601
     | default(lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'), true) }}

# archive_min_bytes is per environment and must NOT get a default here: playbook
# group_vars outrank inventory group_vars/all, so a default would pin the Docker
# suite to the production floor and fail its few-KB fixture release.


# Read by the `Reset the indexers` handler. Un-sticks cron jobs left marked
# `running` when PHP was killed.
indexers_reset_sql:
  - update mview_state set status='idle' where 1;
  - update cron_schedule set status = "missed" where status = 'running' and job_code rlike 'indexer';
