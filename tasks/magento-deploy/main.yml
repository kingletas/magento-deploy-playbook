---
###
# Put Magento onto the extracted release and cut over to it.
#
# Three things hold throughout. No `changed_when` on commands that change the
# store, deliberately: they report changed every run, and that is what fires the
# handlers. Every Magento command runs on one host, magento_host, chosen before
# anything goes live (magento-host.yml); the tasks loop over it as a one-item
# list so their registers keep the `.results` shape the readers expect. And
# `run_once` is load-bearing on every delegated task -- without it the command
# runs once per WEB host, so a five-host fleet fires it five times at one host.
#
# `var` is per release, so a maintenance flag only covers the release it was
# written in. Maintenance goes on in the incoming release, before the flip, and
# only when the release has database or config work to do.
###

# Everything before the symlink flips leaves nothing live, so a stop anywhere
# in it has one response (release-lock/stopped-before-live.yml): record why,
# release the build lock, and stop with the step's own message.
- name: Prepare the cutover, and stop cleanly when a gate refuses
  block:
    - name: Name the incoming release
      ansible.builtin.set_fact:
        incoming_release: "{{ releases.path }}{{ release_id }}"

    # Read before the flip: afterwards `current` resolves to the new release.
    - name: Record which release is live before the cutover
      ansible.builtin.stat:
        path: '{{ releases.current }}'
        follow: false
      register: outgoing_link

    - name: Stop if a web host dropped out before the cutover
      ansible.builtin.include_tasks: tasks/fleet/intact.yml
      vars:
        fleet_phase: before-cutover
      when: releases.complete | bool

    # Its setup:db:status is the first bin/magento call on the release. `var` is not
    # in the archive, so Magento creates var/log on it, owned by whoever runs it, and
    # every later step runs as system.user, which must be able to write there.
    - name: Choose the host that runs Magento's commands, and stop if none can
      ansible.builtin.import_tasks: tasks/magento-deploy/magento-host.yml

    - name: "Check for app config status"
      ansible.builtin.command: "php {{ deploy_helpers }}magento-isolated.php {{ incoming_release }} -- app:config:status"
      args:
        chdir: '{{ incoming_release }}'
      become_user: '{{ system.user }}'
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: app_config
      changed_when: false
      failed_when: false

    # Neither status command reads the theme table, so a release that only adds a
    # theme passes both and would never be registered.
    - name: Check for themes the database has not registered
      ansible.builtin.command: "php {{ deploy_helpers }}magento-db-guard.php themes {{ incoming_release }}"
      become_user: '{{ system.user }}'
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: theme_config
      changed_when: false
      failed_when: false

    - name: Decide whether this release needs a maintenance window
      ansible.builtin.import_tasks: tasks/magento-deploy/upgrade-gate.yml

    - name: Stop before the cutover on a configuration import that deletes
      ansible.builtin.import_tasks: tasks/magento-deploy/config-import-check.yml

    # The database as the outgoing release left it, read before anything changes
    # so a database that cannot be read stops the deploy with nothing live. What
    # setup:upgrade applies after this is what a rollback cannot take back.
    - name: Mark the database before the cutover
      ansible.builtin.command: "php {{ deploy_helpers }}magento-db-guard.php mark {{ incoming_release }}"
      become_user: '{{ system.user }}'
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: db_mark_before
      changed_when: false

    - name: Keep the mark taken before the cutover
      ansible.builtin.set_fact:
        db_mark_before_upgrade: "{{ (db_mark_before.results | first).stdout | from_json }}"
      run_once: true

    - name: Rehearse setup:upgrade, and stop here if it would lock too much
      ansible.builtin.include_tasks: tasks/forecast/run.yml
      when:
        - lock_forecast.enabled | bool
        - upgrade_needed | bool

    - name: "DORA: record the cutover start"
      ansible.builtin.include_tasks: tasks/dora-event.yml
      vars:
        dora_phase: cutover.started
        dora_extra:
          maintenance: "{{ upgrade_needed | bool }}"

    - name: "Audit: record the cutover start"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: cutover.started
        audit_detail:
          maintenance_window: "{{ upgrade_needed | bool }}"
          artefact_sha256: "{{ release_sha256 | default('') }}"
          magento_host: "{{ magento_host }}"

    - name: Back up when this release requires it
      ansible.builtin.import_tasks: tasks/backup/run.yml

    - name: Enable maintenance mode in the incoming release
      ansible.builtin.command: "php bin/magento maint:enable"
      args:
        chdir: '{{ incoming_release }}'
      become: true
      become_user: '{{ system.user }}'
      when: upgrade_needed | bool
      notify: Open the PagerDuty maintenance window

    - name: "DORA: record maintenance mode on"
      ansible.builtin.include_tasks: tasks/dora-event.yml
      vars:
        dora_phase: maintenance.enabled
      when: upgrade_needed | bool

    - name: "Audit: record maintenance mode on"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: maintenance.enabled
      when: upgrade_needed | bool

    - name: Stop if a web host dropped out before the switch
      ansible.builtin.include_tasks: tasks/fleet/intact.yml
      vars:
        fleet_phase: before-switch
      when: releases.complete | bool
  rescue:
    - name: Stop, releasing the lock
      ansible.builtin.include_tasks: tasks/release-lock/stopped-before-live.yml
      vars:
        stopped_phase: before-switch

- name: Reset the current symlink
  ansible.builtin.file:
    src: '{{ incoming_release }}'
    path: '{{ releases.current }}'
    state: link
    force: true
  become: true
  when: releases.complete | bool
  notify:
    - Stop lingering PHP processes

# A php-fpm worker keeps the path it resolved `current` to, so the flip takes
# effect only after this. A reload lets in-flight requests finish.
- name: Reload the web services, so they serve the new release
  ansible.builtin.service:
    name: '{{ item }}'
    state: reloaded
  become: true
  loop:
    - '{{ php_service }}'
    - nginx

- name: Stop if a web host dropped out during the switch
  ansible.builtin.include_tasks: tasks/fleet/intact.yml
  vars:
    fleet_phase: switch
  when: releases.complete | bool

# After the reload, so no worker is still serving the outgoing release, and
# before setup:upgrade, so a deploy that fails from here on leaves a release to
# roll back to that is not in maintenance.
- name: Take the replaced release out of maintenance mode
  ansible.builtin.include_tasks: tasks/release-outgoing-maintenance.yml
  vars:
    outgoing_release: "{{ outgoing_link.stat.lnk_source | default('') if outgoing_link.stat.islnk | default(false) else '' }}"

# From here every web host serves the new release. Each step has a decided
# response to failing (after-switch-failed.yml): the deploy stops, records which
# step and why, releases the lock and says what is left to run. setup:upgrade,
# between the two blocks, keeps its own, since it may leave the database part
# migrated. A step that runs on every web host ignores its own failure and a
# check after it fails once for all of them, so no host carries on alone.
- name: Flush the cache before setup:upgrade, and stop cleanly when it fails
  block:
    - name: Flush magento cache
      ansible.builtin.command: "php bin/magento cache:flush"
      args:
        chdir: '{{ releases.current }}'
      become_user: '{{ system.user }}'
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: magento_cache_flushed
      ignore_unreachable: true

    # Gone mid-command: newer Ansible would mark the host running this unreachable
    # instead, and the failure response would never learn which host it was.
    - name: Stop if the host that runs Magento's commands could not be reached for that
      ansible.builtin.fail:
        msg: >-
          {{ magento_cache_flushed.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | map(attribute='item') | join(', ') }} could not be reached during "Flush magento cache".
      run_once: true
      when: magento_cache_flushed.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable') | list | length > 0
  rescue:
    - name: Stop, and say what is left
      ansible.builtin.include_tasks: tasks/magento-deploy/after-switch-failed.yml
      vars:
        after_switch_from: before-upgrade

# --no-interaction answers the config import's questions yes, which is safe only
# because config-import-check.yml read those questions before the cutover and
# stopped on any deletion nobody accepted. Without it the import aborts on a
# theme or scope change and fails the deploy mid-window.
- name: Run setup:upgrade, and when it fails leave maintenance on and say how to recover
  block:
    - name: "Magento's setup upgrade"
      ansible.builtin.command: "php bin/magento setup:upgrade --keep-generated --no-interaction"
      args:
        chdir: '{{ releases.current }}'
      become_user: '{{ system.user }}'
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: magento_upgraded
      ignore_unreachable: true
      when: upgrade_needed | bool

    # Gone mid-command: newer Ansible would mark the host running this unreachable
    # instead, and the failure response would never learn which host it was.
    - name: Stop if the host that runs Magento's commands could not be reached for that
      ansible.builtin.fail:
        msg: >-
          {{ magento_upgraded.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | map(attribute='item') | join(', ') }} could not be reached during "Magento's setup upgrade".
      run_once: true
      when: magento_upgraded.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable') | list | length > 0
  rescue:
    - name: "Audit: record the failed setup:upgrade"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: upgrade.failed
        audit_detail:
          error: "{{ (ansible_failed_result.results | default([ansible_failed_result]) | selectattr('failed', 'defined')
                      | selectattr('failed') | map(attribute='stderr') | first | default('', true)
                      or ansible_failed_result.msg | default(''))[-500:] }}"
          magento_host: "{{ magento_host }}"
          backup_id: "{{ backup_id | default('') }}"

    # The run ends here, so the prune play that normally drops the lock never runs.
    - name: Drop the build lock, since the run ends here
      ansible.builtin.file:
        path: "{{ release_lock_file }}"
        state: absent
      delegate_to: "{{ groups.builder | first }}"
      run_once: true

    - name: Stop in maintenance, and say how to recover
      ansible.builtin.fail:
        msg: >-
          setup:upgrade failed after the cutover on {{ magento_host }}, so the
          database may be part migrated. The site is in maintenance on
          {{ release_id }} and stays there. A code rollback is no answer: the
          rollback guard refuses one after a partial migration. Either restore
          the database
          {{ ('from the backup this deploy took, ' ~ backup_id ~ ',')
             if backup_id | default('') | length > 0 else '(this deploy took no backup)' }}
          and then make rollback, or fix the cause and run
          php bin/magento setup:upgrade --keep-generated --no-interaction in
          {{ releases.current }} on {{ magento_host }}, or on another host in
          magento_hosts if it is gone, then php bin/magento maint:disable.
          The build lock is released.
      run_once: true

- name: Finish the cutover, and stop cleanly when a step fails
  block:
    - name: Flush and enforce cache
      ansible.builtin.command: "php bin/magento {{ item }}"
      args:
        chdir: '{{ releases.current }}'
      become_user: '{{ system.user }}'
      become: true
      loop:
        - "cache:flush"
        - "cache:enable"
      register: cache_enforced
      ignore_errors: true
      notify:
        # - Flush the Yottaa edge cache    # a lower environment is not behind it
        - Notify Slack
        - Create the New Relic deployment marker
        - Post the Noibu release webhook
        - Report which notifications landed

    - name: Stop if the cache failed on any web host
      ansible.builtin.fail:
        msg: "cache:flush or cache:enable failed on {{ failed_hosts | join(', ') }}."
      vars:
        failed_hosts: >-
          {{ ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'cache_enforced'))
             | selectattr('1.failed', 'defined') | selectattr('1.failed') | map('first') | list }}
      run_once: true
      when: failed_hosts | length > 0

    # The ban Magento's own full-page purge sends. Only its pages go: static files
    # move to new versioned URLs and media is shared, so both stay cached.
    - name: Invalidate Magento's pages in Varnish
      ansible.builtin.command:
        argv: [varnishadm, ban, obj.http.X-Magento-Tags, "~", "."]
        # Otherwise `~` expands to the become user's home directory.
        expand_argument_vars: false
      become: true
      run_once: true
      delegate_to: "{{ item }}"
      loop: "{{ groups.varnish }}"
      register: varnish_banned
      ignore_unreachable: true
      when: releases.complete | bool

    # Gone mid-command: newer Ansible would mark the host running this unreachable
    # instead, and the failure response would never learn which host it was.
    - name: Stop if a varnish host could not be reached for that
      ansible.builtin.fail:
        msg: >-
          {{ varnish_banned.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | map(attribute='item') | join(', ') }} could not be reached during "Invalidate Magento's pages in Varnish".
      run_once: true
      when: varnish_banned.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable') | list | length > 0

    # Unconditional: it also clears a flag a failed attempt left in this release.
    - name: Disable maintenance mode
      ansible.builtin.command: "php bin/magento maint:disable"
      args:
        chdir: '{{ releases.current }}'
      become_user: '{{ system.user }}'
      become: true
      register: maintenance_off
      ignore_errors: true
      notify: Warm the caches

    - name: Stop if maintenance could not be turned off on any web host
      ansible.builtin.fail:
        msg: "maint:disable failed on {{ failed_hosts | join(', ') }}, which stay in maintenance."
      vars:
        failed_hosts: >-
          {{ ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'maintenance_off'))
             | selectattr('1.failed', 'defined') | selectattr('1.failed') | map('first') | list }}
      run_once: true
      when: failed_hosts | length > 0

    - name: Reset the indexers, which killing PHP leaves marked running
      ansible.builtin.command: "php bin/magento ind:reset"
      args:
        chdir: '{{ releases.current }}'
      become_user: '{{ system.user }}'
      become: true
      notify: Reset the indexers
      delegate_to: "{{ item }}"
      loop: "{{ [magento_host] }}"
      register: indexers_reset
      ignore_unreachable: true
      run_once: true
      when:
        - releases.kill_php | bool
        - releases.complete | bool

    # Gone mid-command: newer Ansible would mark the host running this unreachable
    # instead, and the failure response would never learn which host it was.
    - name: Stop if the host that runs Magento's commands could not be reached for that
      ansible.builtin.fail:
        msg: >-
          {{ indexers_reset.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable')
             | map(attribute='item') | join(', ') }} could not be reached during "Reset the indexers".
      run_once: true
      when: indexers_reset.results | default([]) | selectattr('unreachable', 'defined') | selectattr('unreachable') | list | length > 0
  rescue:
    - name: Stop, and say what is left
      ansible.builtin.include_tasks: tasks/magento-deploy/after-switch-failed.yml
      vars:
        after_switch_from: after-upgrade

- name: Stop if a web host dropped out after the switch
  ansible.builtin.include_tasks: tasks/fleet/intact.yml
  vars:
    fleet_phase: after-switch
  when: releases.complete | bool

- name: Check the new release, and put the old one back when it fails
  ansible.builtin.include_tasks: tasks/magento-deploy/health.yml
  when:
    - health.enabled | bool
    - releases.complete | bool

# Written only once the release has passed its health check, so a rollback to
# it later can tell what the database gained after it went live.
# Not fatal: the release is live and healthy by now. Without the mark a later
# rollback to it compares against what it declares, which refuses more often.
- name: Mark the database the new release went live with
  ansible.builtin.command: "php {{ deploy_helpers }}magento-db-guard.php mark {{ releases.current }}"
  become_user: '{{ system.user }}'
  become: true
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ [magento_host] }}"
  register: db_mark_live
  changed_when: false
  failed_when: false
  when:
    - releases.complete | bool
    - not deploy_rolled_back | default(false) | bool

- name: Warn when the mark could not be taken
  ansible.builtin.debug:
    msg: >-
      The database mark for {{ release_id }} could not be read, so a later
      rollback to it will compare against what it declares instead:
      {{ (db_mark_live.results | first).stderr | default('') | trim }}
  run_once: true
  when:
    - releases.complete | bool
    - not deploy_rolled_back | default(false) | bool
    - (db_mark_live.results | default([{}]) | first).rc | default(0) != 0

- name: Keep that mark in the release on every web host
  ansible.builtin.copy:
    content: "{{ (db_mark_live.results | first).stdout }}\n"
    dest: "{{ incoming_release }}/.deploy-db-mark.json"
    owner: "{{ system.user }}"
    group: "{{ system.group }}"
    mode: "0644"
  become: true
  when:
    - releases.complete | bool
    - not deploy_rolled_back | default(false) | bool
    - (db_mark_live.results | default([{}]) | first).rc | default(1) == 0
