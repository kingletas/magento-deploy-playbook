---
# What a commit has to pass, run somewhere other than the machine that wrote it.
# The first job is `make check`; the others exercise the deploy end to end,
# split into shards that run side by side, each on a fleet of its own.
# Actions are pinned to a commit SHA, because a tag can be moved.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here writes to the repository or needs a token with more
# than the checkout.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: syntax, structure, offline suites and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Ansible and the collections
        run: |
          make venv
          make collections

      - name: Run the gate
        env:
          REQUIRE_LINT: "1"   # a missing linter here means the install broke
        run: make check

  # The shard names come from the suite itself, so the matrix can't drift from
  # the list `make docker-test` runs locally.
  shards:
    name: list the end-to-end shards
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the shards
        id: list
        run: echo "shards=$(bin/docker-suite shards)" >> "$GITHUB_OUTPUT"

  docker:
    name: end-to-end, ${{ matrix.shard }}
    needs: shards
    runs-on: ubuntu-24.04
    strategy:
      # Every shard reports, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.shards) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Ansible and the collections
        run: |
          make venv
          make collections

      - name: Build the fleet, deploy to it, and assert on the result
        env:
          SHARD: ${{ matrix.shard }}
        run: make docker-test-shard SHARD="$SHARD"

      - name: Tear the fleet down
        if: always()
        run: make docker-down
