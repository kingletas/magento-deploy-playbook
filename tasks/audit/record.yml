---
###
# Appends one event to the audit log on the control node, chained to the record
# before it, and forwards it when audit.forward is set.
#
#   audit_event    the event name, e.g. deploy.started.
#   audit_detail   optional fields for this event.
#
# With audit.required on, a record that cannot be written stops the play.
###
- name: "Audit: record {{ audit_event }}"
  ansible.builtin.command:
    argv:
      - "{{ audit_tool }}"
      - append
      - --path
      - "{{ audit.path }}"
      - --forward
      - "{{ audit.forward }}"
    stdin: >-
      {{ {'event': audit_event,
          'env_name': env_name,
          'release': release_id | default(''),
          'actor': deployer_actor | default({})}
         | combine(audit_detail | default({}))
         | to_json }}
    expand_argument_vars: false
  register: audit_append
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: true
  failed_when: audit_append.rc != 0 and (audit.required | bool)

# So a stop that already said why it failed is not recorded twice by the
# response that releases the lock (release-lock/stopped-before-live.yml).
- name: "Audit: note that this run has recorded a failure"
  ansible.builtin.set_fact:
    audit_failure_recorded: true
  run_once: true
  when: audit_event is search('\\.(failed|refused)$')

# A record that can end a run badly also (re)writes the release's postmortem
# draft, so the last such record leaves the fullest one. audit-log writes
# nothing for a run that went well, and a draft that cannot be written never
# stops the deploy: the records it is built from are already in the log.
- name: "Audit: draft the postmortem after {{ audit_event }}"
  ansible.builtin.command:
    argv:
      - "{{ audit_tool }}"
      - postmortem
      - --path
      - "{{ audit.path }}"
      - --release
      - "{{ release_id }}"
      - --out
      - "{{ audit_postmortem_dir }}/{{ release_id }}.md"
  register: audit_postmortem
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: audit_postmortem.stdout is search('^postmortem draft')
  failed_when: false
  when:
    - audit_append is succeeded
    - release_id | default('') | length > 0
    - audit_event in audit_postmortem_events

- name: "Audit: say where the postmortem draft is"
  ansible.builtin.debug:
    msg: "{{ audit_postmortem.stdout if audit_postmortem.rc == 0 else 'The postmortem draft was not written: ' ~ (audit_postmortem.stderr | trim) }}"
  run_once: true
  when: audit_postmortem is changed or (audit_postmortem.rc | default(0)) != 0
