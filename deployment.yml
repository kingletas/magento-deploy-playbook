---
# Runs on the control node, because it has to decide before anything connects.
- name: Check this is not the shipped template
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse the example inventory
      ansible.builtin.import_tasks: tasks/template-guard.yml

- name: Start the build process
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Record the web hosts this deploy begins with
      ansible.builtin.import_tasks: tasks/fleet/record.yml

    - name: Resolve and validate the release facts, before anything is created
      ansible.builtin.include_tasks: tasks/release-preflight.yml

    - name: Take the build lock
      ansible.builtin.import_tasks: tasks/release-lock/acquire.yml

  # From here to the switch, a stop leaves nothing live, so each play's steps
  # share one response: record it, release the lock, stop with the step's words.
  tasks:
    - name: Check the fleet, and say the deploy has started
      block:
        - name: Check every varnish host can be invalidated
          ansible.builtin.import_tasks: tasks/controls/varnish-ready.yml

        - name: "Audit: record the deploy request"
          ansible.builtin.include_tasks: tasks/audit/record.yml
          vars:
            audit_event: deploy.started
            audit_detail:
              branch: "{{ branch_name }}"
              reused_release: "{{ use_existing_release | bool }}"
              goes_live: "{{ deployment_complete | bool }}"
              playbook_commit: "{{ lookup('pipe', 'git -C ' ~ (playbook_dir | quote) ~ ' rev-parse HEAD 2>/dev/null || true') }}"
      rescue:
        - name: Stop, releasing the lock
          ansible.builtin.include_tasks: tasks/release-lock/stopped-before-live.yml
          vars:
            stopped_phase: preflight

- name: "Building the release"
  hosts: builder
  vars:
    deployment_status: started
  handlers:
    - name: Playbook handlers
      ansible.builtin.import_tasks: handlers/main.yml
  pre_tasks:
    - name: Build the release, and stop cleanly when it fails
      block:
        - name: Sync the repository checkout
          ansible.builtin.import_tasks: tasks/packaging/git.yml

        - name: Refuse a commit nobody approved
          ansible.builtin.import_tasks: tasks/approval/verify.yml

        - name: Build the release
          ansible.builtin.import_tasks: tasks/packaging/deploy.yml

        - name: Bundle the JavaScript, using the static content the build deployed
          ansible.builtin.import_tasks: tasks/packaging/bundle.yml

        - name: Archive the release
          ansible.builtin.import_tasks: tasks/packaging/archive.yml

        - name: Record what this build was made from, for the next one
          ansible.builtin.import_tasks: tasks/packaging/stamp.yml
      rescue:
        # As root, like the play that took the lock: this play does not become,
        # and /tmp's sticky bit refuses anyone else the unlink.
        - name: Stop, releasing the lock
          ansible.builtin.include_tasks:
            file: tasks/release-lock/stopped-before-live.yml
            apply:
              become: true
          vars:
            stopped_phase: build

  tasks:
    - name: Record the build, and stop cleanly when it fails
      block:
        - name: Read the built commit
          ansible.builtin.command: "git rev-parse HEAD"
          args:
            chdir: "{{ wdir }}"
          register: built_commit
          changed_when: false
          failed_when: false
          run_once: true

        - name: Read the commit count since the base branch
          ansible.builtin.command: "git rev-list --count {{ regular_base_branch }}..HEAD"
          args:
            chdir: "{{ wdir }}"
          register: built_commit_count
          changed_when: false
          failed_when: false
          run_once: true

        - name: "DORA: record the build"
          ansible.builtin.include_tasks: tasks/dora-event.yml
          vars:
            dora_phase: build.succeeded
            dora_extra:
              commit_to: "{{ built_commit.stdout | default('') | trim }}"
              commit_count: "{{ built_commit_count.stdout | default('') | trim }}"
              builder: "{{ inventory_hostname }}"

        - name: "Audit: record the build"
          ansible.builtin.include_tasks: tasks/audit/record.yml
          vars:
            audit_event: build.succeeded
            audit_detail:
              commit: "{{ built_commit.stdout | default('') | trim }}"
              artefact_sha256: "{{ release_sha256 }}"
              builder: "{{ inventory_hostname }}"
      rescue:
        # As root, like the play that took the lock: this play does not become,
        # and /tmp's sticky bit refuses anyone else the unlink.
        - name: Stop, releasing the lock
          ansible.builtin.include_tasks:
            file: tasks/release-lock/stopped-before-live.yml
            apply:
              become: true
          vars:
            stopped_phase: build

- name: Upload the archive and unpack the release
  hosts: web
  become: true
  gather_facts: false
  vars:
    deployment_status: uploaded
  handlers:
    - name: Playbook handlers
      ansible.builtin.import_tasks: handlers/main.yml
  tasks:
    # No block here: a host that fails its upload drops out of the play, and the
    # fleet check below names it and releases the lock, as for a lost host.
    - name: Upload the release archive to the host
      ansible.builtin.import_tasks: tasks/deploy/upload.yml
      when: releases.upload

    - name: Unarchive the release on the host
      ansible.builtin.import_tasks: tasks/deploy/unarchive.yml
      when: releases.unarchive

    - name: Stop if a web host dropped out during the upload
      ansible.builtin.include_tasks: tasks/fleet/intact.yml
      vars:
        fleet_phase: upload

- name: Deploy Magento to the web hosts (includes admin & cron)
  hosts: "web"
  become: true
  gather_facts: false
  vars:
    deployment_status: completed
  handlers:
    - name: Playbook handlers
      ansible.builtin.import_tasks: handlers/main.yml
  tasks:
    - name: Deploy Magento onto the release
      ansible.builtin.import_tasks: tasks/magento-deploy/main.yml

    - name: "DORA: record the deploy"
      ansible.builtin.include_tasks: tasks/dora-event.yml
      vars:
        dora_phase: "{{ 'cutover.rolled_back' if deploy_rolled_back | default(false) | bool else 'cutover.succeeded' }}"
        dora_extra:
          outcome: "{{ 'failure' if deploy_rolled_back | default(false) | bool else 'success' }}"

    - name: "Audit: record the cutover"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: cutover.succeeded
        audit_detail:
          maintenance_window: "{{ upgrade_needed | bool }}"
          setup_upgrade_ran: "{{ upgrade_needed | bool }}"
          backup_id: "{{ backup_id | default('') }}"
      when: not deploy_rolled_back | default(false) | bool

    # Handlers otherwise run when the play ends, after the flag below, so one that
    # failed could not stop the deploy being recorded as finished. Run them here
    # instead, where a failure gets the same response as a step after the switch.
    - name: Run the handlers, and stop cleanly if one fails
      block:
        - name: Run the handlers now
          ansible.builtin.meta: flush_handlers

        - name: Stop if a handler could not reach the host it needed
          ansible.builtin.fail:
            msg: "{{ unreached | join('; ') }} could not be reached while the handlers ran."
          vars:
            unreached: >-
              {{ (ansible_play_hosts | map('extract', hostvars) | map(attribute='php_stopped', default={})
                  | map(attribute='results', default=[]) | flatten(levels=1)
                  | selectattr('unreachable', 'defined') | selectattr('unreachable')
                  | map(attribute='item') | list)
                 + (ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars)
                      | map(attribute='indexers_sql_reset', default={}))
                    | selectattr('1.unreachable', 'defined') | selectattr('1.unreachable')
                    | map('first') | list)
                 | unique | list }}
          run_once: true
          when: unreached | length > 0
      rescue:
        - name: Stop, and say what is left
          ansible.builtin.include_tasks: tasks/magento-deploy/after-switch-failed.yml
          vars:
            after_switch_from: handlers

    # What the prune play checks before it prunes or records the deploy as
    # finished, so a Magento play that ended with no web host left cannot be
    # followed by a builder recording success on its own.
    - name: Record that the Magento play reached its end
      ansible.builtin.set_fact:
        magento_play_completed: true
      delegate_to: localhost
      delegate_facts: true
      run_once: true

- name: Clean old releases on the web hosts and the builder
  hosts: "web builder"
  become: true
  gather_facts: true
  tasks:
    - name: Stop here unless the Magento play reached its end
      ansible.builtin.meta: end_play
      when: not hostvars['localhost'].magento_play_completed | default(false) | bool

    # The release is live by here, so a prune that fails still lets the lock go:
    # old releases left on disk need no one before the next deploy.
    - name: Prune, and drop the build lock whatever the prune does
      block:
        - name: Prune this environment's releases and archives
          ansible.builtin.include_tasks: tasks/release-prune.yml
          vars:
            # No fallback: an empty scope matches another environment's releases.
            prune_env: "{{ suffix | string }}"
            # False for the builder, which serves no traffic and has no `current`.
            prune_require_live_release: "{{ inventory_hostname not in (groups['builder'] | default([])) }}"
      always:
        - name: Drop the build lock
          ansible.builtin.import_tasks: tasks/release-lock/release.yml

    - name: "Audit: record the finished deploy"
      ansible.builtin.include_tasks: tasks/audit/record.yml
      vars:
        audit_event: deploy.finished
        audit_detail:
          # From the web hosts in this run, not the inventory's first one, which
          # --limit can leave out.
          outcome: >-
            {{ 'rolled_back'
               if groups.web | intersect(ansible_play_hosts_all) | map('extract', hostvars)
                  | selectattr('deploy_rolled_back', 'defined') | selectattr('deploy_rolled_back')
                  | list | length > 0
               else 'success' }}

  handlers:
    - name: Playbook handlers
      ansible.builtin.import_tasks: handlers/main.yml

# Last, so a poor warm-up never leaves the prune undone or the lock held.
- name: Hold the warm-up to its threshold
  hosts: web
  become: false
  gather_facts: false
  tasks:
    - name: Fail when too few warm-up requests answered 2xx
      ansible.builtin.import_tasks: tasks/warmup/verdict.yml

# After the prune and the lock, so a rolled-back deploy leaves neither behind,
# and last, so the run still ends red.
- name: Fail a deploy that was rolled back
  hosts: web
  become: false
  gather_facts: false
  tasks:
    - name: Fail, naming the release that is live again
      ansible.builtin.fail:
        msg: >-
          The new release failed its health check and the previous release,
          {{ rollback_target | basename }}, is live again. The failed release is
          still on disk for a look: {{ incoming_release }}.
      run_once: true
      when: deploy_rolled_back | default(false) | bool
