---
###
# Copies the deploy's PHP helpers to the hosts where the Magento CLI steps run,
# beside the releases and outside any web root.
#
#   helpers_hosts         where to copy them; the admin group when unset.
#   helpers_best_effort   true lets a host that cannot take them pass, so the
#                         deploy's choice of host can try the next one.
###
- name: Create the helpers directory
  ansible.builtin.file:
    path: "{{ deploy_helpers }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ helpers_hosts | default(groups.admin) }}"
  register: helpers_dir
  ignore_errors: "{{ helpers_best_effort | default(false) }}"
  ignore_unreachable: "{{ helpers_best_effort | default(false) }}"

- name: Copy the helpers
  ansible.builtin.copy:
    src: "helpers/{{ item.1 }}"
    dest: "{{ deploy_helpers }}{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  run_once: true
  delegate_to: "{{ item.0 }}"
  loop: "{{ helpers_hosts | default(groups.admin) | product(['magento-isolated.php', 'magento-db-guard.php', 'magento-config-warnings.php']) | list }}"
  register: helpers_copied
  ignore_errors: "{{ helpers_best_effort | default(false) }}"
  ignore_unreachable: "{{ helpers_best_effort | default(false) }}"
