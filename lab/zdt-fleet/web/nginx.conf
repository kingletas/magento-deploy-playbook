# Serves whichever release current points at. $realpath_root resolves the
# symlink per request, so PHP sees the release's real path and a relink takes
# effect on the next request without a reload.
server {
    listen 80 default_server;
    set $MAGE_ROOT /var/www/magento/current;
    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    charset UTF-8;
    client_max_body_size 64m;

    # PHP-FPM answers its ping only when both script names are the ping path;
    # the healthcheck uses it to see nginx and PHP-FPM up together.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /static/ {
        expires max;
        location ~ ^/static/version\d*/ {
            rewrite ^/static/version\d*/(.*)$ /static/$1 last;
        }
        if (!-f $request_filename) {
            rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last;
        }
    }

    location /media/ {
        location ~ ^/media/(customer|downloadable|import|custom_options)/ { deny all; }
        try_files $uri $uri/ /get.php$is_args$args;
    }

    location ~ ^/(index|get|static|health_check|errors/report|errors/404|errors/503)\.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~* (\.php$|\.phtml$|\.htaccess$) { deny all; }
}
