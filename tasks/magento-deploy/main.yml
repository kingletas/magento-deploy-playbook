---
###
# Put Magento onto the extracted release and cut over to it.
#
# Two things hold throughout. No `changed_when` on these commands, deliberately:
# they report changed every run, and that is what fires the handlers. And
# `run_once` is load-bearing on every delegated task -- without it
# `delegate_to: item` with `loop: groups.admin` runs once per WEB host, so a
# five-host fleet fires the same command five times at one admin.
###

- name: Reset the current symlink
  ansible.builtin.file:
    src: '{{ releases.path }}{{ release_id }}'
    path: '{{ releases.current }}'
    state: link
    force: true
  become: true
  when: releases.complete | bool
  notify:
    - Restart PHP
    - Restart nginx
    - Stop lingering PHP processes

- name: Restart the web services
  ansible.builtin.service:
    name: '{{ item }}'
    state: restarted
  become: true
  loop:
    - '{{ php_service }}'
    - nginx

# `var` is not in the archive, so Magento creates var/log on this call, owned by
# whoever runs it. Every later step runs as system.user and must be able to write.
- name: Check for setup upgrade, the first bin/magento call on the release
  ansible.builtin.command: "php bin/magento setup:db:status"
  args:
    chdir: '{{ releases.current }}'
  become: true
  become_user: '{{ system.user }}'    # not root; see above
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ groups.admin }}"
  register: db_config
  failed_when: false

- name: "Check for app config status"
  ansible.builtin.command: "php bin/magento app:config:status"
  args:
    chdir: '{{ releases.current }}'
  become_user: '{{ system.user }}'
  become: true
  run_once: true
  failed_when: false
  delegate_to: "{{ item }}"
  loop: "{{ groups.admin }}"
  register: app_config

- name: Flush magento cache
  ansible.builtin.command: "php bin/magento cache:flush"
  args:
    chdir: '{{ releases.current }}'
  become_user: '{{ system.user }}'
  become: true
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ groups.admin }}"

- name: "Magento's setup upgrade"
  ansible.builtin.command: "php bin/magento setup:upgrade --keep-generated"
  args:
    chdir: '{{ releases.current }}'
  become_user: '{{ system.user }}'
  become: true
  run_once: true
  delegate_to: "{{ item }}"
  loop: "{{ groups.admin }}"
  # Both registers are LOOPED, so each is a dict with a .results list. Never
  # `"text" in db_config`: that tests the dict's KEYS, is permanently false, and
  # silently stops the gate. `| first | default({})` because an empty admin
  # group leaves results absent and a bare [0] raises mid-maintenance.
  when: >-
    ((db_config.results | default([]) | first | default({})).stdout | default(''))
      is search('Declarative Schema is not up to date')
    or
    ((app_config.results | default([]) | first | default({})).stdout | default(''))
      is search('Config files have changed')

- name: Flush and enforce cache... disable maintenance mode
  ansible.builtin.command: "php bin/magento {{ item }}"
  args:
    chdir: '{{ releases.current }}'
  become_user: '{{ system.user }}'
  become: true
  loop:
    - "cache:flush"
    - "cache:enable"
    - "maint:disable"
  # PHP caches the symlink-resolved path, so a worker that resolved it before
  # the cutover still serves the previous release. This handler runs at the end
  # of the play, after maintenance is lifted.
  notify:
    - Restart PHP
    # - Flush the Yottaa edge cache    # a lower environment is not behind it
    - Notify Slack
    - Create the New Relic deployment marker
    - Post the Noibu release webhook
    - Report which notifications landed

- name: Reset the indexers, which killing PHP leaves marked running
  ansible.builtin.command: "php bin/magento ind:reset"
  args:
    chdir: '{{ releases.current }}'
  become_user: '{{ system.user }}'
  become: true
  notify: Reset the indexers
  delegate_to: "{{ item }}"
  loop: "{{ groups.admin }}"
  run_once: true
  when:
    - releases.kill_php | bool
    - releases.complete | bool
