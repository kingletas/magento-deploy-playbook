; PHP-FPM runs the store as deploy, the user the arms ssh in as, so a release
; unpacked over ssh is readable and var/ is writable by the same user.
[www]
user = deploy
group = deploy
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
ping.path = /fpm-ping
