---
###
# Take the build lock on the builder, so two people cannot build the same
# environment at once. `make unlock environment=<env>` clears a stale one.
#
# The lock says who took it and for which release, and a deploy that stops in
# a state a person must look at first rewrites it with why (hold.yml). A second
# deploy is refused with whatever it says, so the refusal names the reason.
#
# release_lock_file is a set_fact because release.yml needs the same value in a
# later play. `suffix` has no default: a lock at /tmp/.lock would be shared.
###
- name: Set the lock file name
  ansible.builtin.set_fact:
    release_lock_file: "/tmp/{{ suffix | lower }}.lock"
  run_once: true
  delegate_to: "{{ builder }}"

- name: Check if there is a lock file
  ansible.builtin.stat:
    path: "{{ release_lock_file }}"
  delegate_to: "{{ builder }}"
  run_once: true
  register: lock_path_validation

- name: Read what the lock says
  ansible.builtin.slurp:
    path: "{{ release_lock_file }}"
  delegate_to: "{{ builder }}"
  run_once: true
  register: lock_held_by
  when: lock_path_validation.stat.exists

- name: Exit current play if a lock file exists
  ansible.builtin.fail:
    msg: >-
      The lock file {{ release_lock_file }} exists on the {{ builder }} builder:
      {{ (lock_held_by.content | default('') | b64decode | trim) or 'it says nothing about who took it' }}.
      If no deploy is running, read the audit log's last records for this
      environment, deal with what they describe, then: make unlock environment=<env>
  when: lock_path_validation.stat.exists
  run_once: true
  delegate_to: "{{ builder }}"

- name: Add the current play lock file
  ansible.builtin.copy:
    content: >-
      taken {{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }} by
      {{ (deployer_actor | default({})).git_email | default('', true) or 'an unknown deployer' }}
      for release {{ release_id | default('?') }}
    dest: "{{ release_lock_file }}"
    mode: "0644"
  delegate_to: "{{ builder }}"
  run_once: true
