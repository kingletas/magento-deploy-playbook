---
###
# THIS FILE IS THE ONLY PLACE THIS ENVIRONMENT'S VALUES MAY BE DECLARED.
#
# Playbook group_vars outrank inventory group_vars/all, so a key declared in
# both silently resolves to ../../group_vars/ and this file is ignored.
# tests/test-vars-contract.yml fails on any key in both. See "The one rule" in
# ../../README.md.
###

# env_name - names this environment in the DORA event log, and derives
# releases.name.
env_name: example

# suffix - names the release directory and scopes the prune. A literal, not
# derived from branch_name, so everything landing in this slot prunes against
# one scope whichever branch was deployed.
suffix: example_staging

# branch_name - the branch the build checks out. Override for one run with
# `branch_name=`, which does not change suffix.
branch_name: develop

# php_version - sets the FPM service name. Must be at or above
# php_minimum_version, which the build asserts.
php_version: '8.4'

# profile - the wording in the Slack message and the PagerDuty description.
profile: "Deploying develop to the example staging environment."

# deployment_complete - gates the `current` symlink flip. False builds and
# deploys without going live, for rehearsing a build.
deployment_complete: true

# git_repo - where the release is cloned from. The builder needs read access.
git_repo: git@github.com:example-org/magento2-store.git

# warmup - requests storefront pages from the control node once maintenance is
# off, so the first customers do not pay for a cold cache. The paths go first,
# then the sitemap's URLs on base_url's host, up to `limit`. It never fails the
# deploy unless fewer than `fail_below` percent answer 2xx; 0 only reports.
#   enabled      true or false
#   base_url     the storefront root, ending in "/"
#   paths        pages to warm first, each starting with "/"
#   sitemap      a path under base_url, or "" for none. An index is followed once
#   limit        the most URLs requested, after duplicates are removed
#   concurrency  requests at a time, 1 to 64
#   timeout      seconds per request
#   fail_below   percentage of 2xx needed, 0 to 100
warmup:
  enabled: false
  base_url: https://stage.example.com/
  paths:
    - /
  sitemap: sitemap.xml
  limit: 200
  concurrency: 8
  timeout: 30
  fail_below: 0

# audit - the append-only, hash-chained log of every deploy, on the control node.
#   path      where the log lives. Keep it; `make audit-verify` checks it
#   forward   a command and arguments that receive each record on stdin, such as
#             "logger -t magento-deploy". Send it somewhere nobody here can
#             rewrite: the local chain shows tampering, it cannot prevent it
#   required  stop the deploy when a record cannot be written or forwarded
audit:
  path: ~/.local/state/magento-deploy-playbook/example.audit.jsonl
  forward: ""
  required: true

# approval - build only a commit someone other than the deployer approved: a tag
# matching tag_pattern on the commit, signed with an SSH key in allowed_signers
# (OpenSSH allowed_signers format, a path on the control node).
approval:
  required: true
  allowed_signers: /etc/magento-deploy/allowed_signers
  tag_pattern: "approved/*"

# backup - a command run on the first admin host before maintenance goes on and
# the symlink flips. Its last line of output is recorded as the backup id.
#   run      never, window (only when the release takes a maintenance window)
#            or always
#   command  runs with bash; it must print the snapshot or dump name last
#   timeout  seconds before the backup counts as failed
backup:
  run: window
  command: /usr/local/bin/snapshot-magento-database
  timeout: 3600

# kill_php - kill lingering PHP workers on cron and admin before the cutover.
kill_php: false

# archive_min_bytes - the floor the built tarball must exceed. 10 MB catches an
# empty archive; it is not a size expectation.
archive_min_bytes: 10485760

# release_disk_min_bytes - free space each host must have before the deploy
# starts. 8 GB is an estimate; the check reports real free space on every
# passing host, so one green deploy gives you the number to set it from.
release_disk_min_bytes: 8589934592

# notify_via_slack - announce the deploy in Slack. Off by default. Requires a
# live slack_token in ../../group_vars/all/notifications.yml: with this on and
# no token the module is still called and the failure swallowed, so nothing is
# delivered and the run looks clean.
notify_via_slack: false
